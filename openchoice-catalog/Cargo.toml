[package]
name = "openchoice-catalog"
description = "Pack an LLM catalog into the .ocb format openchoice-core reads in place."
version.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

[[bin]]
name = "openchoice-catalog"
path = "src/main.rs"

[dependencies]
openchoice-core = { version = "0.1.0", path = "../openchoice-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
